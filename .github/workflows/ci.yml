name: CI / Release

# Unified pipeline replacing the four overlapping workflows
# (build.yml, build-and-release.yml, release-arm64.yml, release.yml).
# One trigger set, one test run, one single-arch optimized APK build,
# one release job. No duplicated checkout/JDK/Gradle/test/build work.
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Target architecture'
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
          - universal
        default: arm64-v8a
      release:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
      - '!i18n-aniyomi/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-aniyomi/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-aniyomi/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-aniyomi/src/commonMain/moko-resources/base/plurals.xml'
      - '!i18n-animiru/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n-animiru/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n-animiru/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n-animiru/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main
      - animiru-new-main
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  DO_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Tune Gradle daemons for CI
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'kotlin.daemon.jvmargs=-Xmx3g' >> ~/.gradle/gradle.properties

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Upload test report
        if: steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

  build:
    name: Build (${{ inputs.architecture || 'arm64-v8a' }})
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      arch: ${{ steps.resolve-arch.outputs.arch }}
      tag: ${{ steps.resolve-tag.outputs.tag }}
      apk_name: ${{ steps.resolve-apk.outputs.apk_name }}

    steps:
      - name: Resolve architecture
        id: resolve-arch
        run: |
          # Manual trigger: use input. Automated: arm64-v8a for CI, universal for tag releases.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "arch=${{ inputs.architecture }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "arch=universal" >> $GITHUB_OUTPUT
          else
            echo "arch=arm64-v8a" >> $GITHUB_OUTPUT
          fi

      - name: Resolve tag
        id: resolve-tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=manual-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "tag=ci-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Tune Gradle daemons for CI
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' 'kotlin.daemon.jvmargs=-Xmx3g' >> ~/.gradle/gradle.properties

      - name: Build release APK
        run: |
          ARCH="${{ steps.resolve-arch.outputs.arch }}"
          if [[ "$ARCH" == "universal" ]]; then
            ./gradlew assembleRelease -Pinclude-cast -Penable-updater
          else
            ./gradlew assembleRelease -Pinclude-cast -Penable-updater -PabiFilter=$ARCH
          fi

      - name: Rename APK
        id: resolve-apk
        run: |
          set -e
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          ARCH="${{ steps.resolve-arch.outputs.arch }}"

          if [[ "$ARCH" == "universal" ]]; then
            SRC="app/build/outputs/apk/release/app-universal-release.apk"
            DEST="Animiru-${TAG}.apk"
          else
            SRC="app/build/outputs/apk/release/app-${ARCH}-release.apk"
            DEST="Animiru-${ARCH}-${TAG}.apk"
          fi

          mv "$SRC" "$DEST"
          echo "apk_name=${DEST}" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Animiru-${{ steps.resolve-arch.outputs.arch }}
          path: ${{ steps.resolve-apk.outputs.apk_name }}

      - name: Upload mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ steps.resolve-arch.outputs.arch }}
          path: app/build/outputs/mapping/release

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: env.DO_RELEASE == 'true' || env.IS_TAG == 'true'

    steps:
      - name: Download APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Animiru-${{ needs.build.outputs.arch }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Animiru ${{ needs.build.outputs.tag }}
          body: |
            Architecture: `${{ needs.build.outputs.arch }}`

            If you are unsure which version to download then go with `${{ needs.build.outputs.apk_name }}`
          files: ${{ needs.build.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
